# ==============================================================================
# Docker Compose for Medicraft Health AI/ML Processing Backend
# Single-container deployment: isolates Python, ML pipelines, RAG, and LLM services.
# ==============================================================================

version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medicraft-ai-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
    env_file:
      - ./backend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
